name: Build Jungle Vet APK

on:
  push:
    paths:
      - "jungle_vet_godot_v2_5.zip"
      - "jungle_vet_godot_v2_6_debugged.zip"
      - "jungle_vet/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "jungle_vet/project.godot" ]; then
            PROJECT="$GITHUB_WORKSPACE/jungle_vet"
          elif [ -f "jungle_vet_godot_v2_6_debugged.zip" ] || [ -f "jungle_vet_godot_v2_5.zip" ]; then
            ARCHIVE="jungle_vet_godot_v2_6_debugged.zip"
            [ -f "$ARCHIVE" ] || ARCHIVE="jungle_vet_godot_v2_5.zip"
            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -o "$ARCHIVE" -d "$GITHUB_WORKSPACE/extracted"
            PROJECT="$(find "$GITHUB_WORKSPACE/extracted" -name project.godot -type f -print -quit | xargs -r dirname)"
          else
            echo "::error::No project found. Upload jungle_vet_godot_v2_6_debugged.zip to the repository root, or commit jungle_vet/project.godot with the project files."
            exit 1
          fi
          test -n "$PROJECT" && test -f "$PROJECT/project.godot" || { echo "::error::project.godot not found after preparing the project"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          mkdir -p "$PROJECT/build"
          cat > "$PROJECT/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path="build/JungleVet-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.jangalm.junglevet"
          package/name="Jungle Vet"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=1
          permissions/internet=false
          EOF

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT" --editor --quit

      - name: Smoke-test main scene
        shell: bash
        run: |
          set -uo pipefail
          set +e
          godot --headless --path "$PROJECT" --quit-after 5 2>&1 | tee "$PROJECT/build/startup.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource|ERROR: Cannot open file" "$PROJECT/build/startup.log"; then
            echo "::error::Project startup smoke test failed; see startup.log above."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT" --export-debug "Android" "$PROJECT/build/JungleVet-debug.apk"

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/build/JungleVet-debug.apk"
          test -s "$APK" || { echo "::error::Godot did not produce an APK"; exit 1; }
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JungleVet-debug-APK
          path: ${{ env.PROJECT }}/build/JungleVet-debug.apk
          if-no-files-found: error
          retention-days: 7
