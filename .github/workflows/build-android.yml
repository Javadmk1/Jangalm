name: Build Jungle Vet APK

on:
  push:
    paths:
      - "jungle_vet_godot_v2_5.zip"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="jungle_vet_godot_v2_5.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Upload jungle_vet_godot_v2_5.zip to the repository root first."
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          PROJECT="extracted/jungle_vet"
          test -f "$PROJECT/project.godot"
          mkdir -p "$PROJECT/build"

          cat > "$PROJECT/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path="build/JungleVet-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.jangalm.junglevet"
          package/name="پزشک فوری جنگل"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=1
          permissions/internet=false
          EOF

      - name: Check project imports
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path extracted/jungle_vet --editor --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path extracted/jungle_vet --export-debug "Android" extracted/jungle_vet/build/JungleVet-debug.apk

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s extracted/jungle_vet/build/JungleVet-debug.apk
          file extracted/jungle_vet/build/JungleVet-debug.apk
          ls -lh extracted/jungle_vet/build/JungleVet-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JungleVet-debug-APK
          path: extracted/jungle_vet/build/JungleVet-debug.apk
          if-no-files-found: error
          retention-days: 7
